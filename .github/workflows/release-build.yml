name: Release build (obfuscated)

# Manual: Actions tab -> "Release build (obfuscated)" -> Run workflow.
# Kept separate from CI so a signing or SDK problem never turns the main
# CI badge red.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # --obfuscate renames classes and methods; --split-debug-info keeps the
      # symbols out of the app so stack traces can still be decoded later.
      - name: Build obfuscated release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk

      # Keep these private: they are needed to decode crash stack traces.
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
